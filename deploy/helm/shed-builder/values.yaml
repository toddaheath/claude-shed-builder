api:
  image:
    repository: shed-builder-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  corsAllowedOrigins: ""
  # REQUIRED: Set via --set api.jwtSecretKey=<key> or external secrets manager.
  # Must be at least 32 characters. DO NOT commit real keys.
  jwtSecretKey: "CHANGE-ME-SET-VIA-HELM-SET-OR-EXTERNAL-SECRETS"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  enabled: true
  image:
    repository: shed-builder-ui
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  database: shedbuilder
  username: shedbuilder
  # REQUIRED: Set via --set postgres.password=<password> or external secrets manager.
  # DO NOT commit real passwords.
  password: "CHANGE-ME-SET-VIA-HELM-SET-OR-EXTERNAL-SECRETS"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
    storageClass: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  annotations: {}
  apiHost: shed-builder-api.local
  uiHost: shed-builder.local
  tls: []
