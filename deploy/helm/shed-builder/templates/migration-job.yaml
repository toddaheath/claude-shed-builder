apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shed-builder.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "shed-builder.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "shed-builder.fullname" . }}-postgres -p {{ .Values.postgres.port }} -U {{ .Values.postgres.username }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          command: ["dotnet", "ShedBuilder.Api.dll"]
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shed-builder.fullname" . }}-db
                  key: postgres-password
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ include "shed-builder.fullname" . }}-postgres;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(DB_PASSWORD)"
