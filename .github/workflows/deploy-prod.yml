name: Deploy to Prod

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write  # required for OIDC authentication with Azure

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    needs: ci
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        id: meta
        run: echo "tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-api:latest

  deploy-spa:
    name: Deploy SPA to Storage
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/shed-builder-ui/package-lock.json

      - name: Install dependencies
        working-directory: src/shed-builder-ui
        run: npm ci

      - name: Build SPA
        working-directory: src/shed-builder-ui
        env:
          VITE_API_BASE_URL: https://shed-builder-api.heathrobotics.io/api/v1
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload SPA to storage account
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name stshedbuilderspaprod \
            --query '[0].value' -o tsv)
          az storage blob upload-batch \
            --account-name stshedbuilderspaprod \
            --destination '$web' \
            --source src/shed-builder-ui/dist/ \
            --overwrite \
            --account-key "$STORAGE_KEY"

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version v1.16.2 \
            --set crds.enabled=true \
            --wait

      - name: Apply ClusterIssuer
        env:
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: envsubst < deploy/cluster/cert-manager-issuer.yaml | kubectl apply -f -

      - name: Roll back stuck Helm release
        run: |
          STATUS=$(helm status shed-builder-api --namespace shed-builder-api-prod -o json 2>/dev/null | jq -r '.info.status' || echo "not-found")
          if [[ "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-install" || "$STATUS" == "pending-rollback" ]]; then
            echo "Release is stuck in status: $STATUS — rolling back"
            helm rollback shed-builder-api --namespace shed-builder-api-prod || helm uninstall shed-builder-api --namespace shed-builder-api-prod || true
          fi

      - name: Deploy with Helm
        run: |
          helm upgrade --install shed-builder-api deploy/helm/shed-builder \
            --namespace shed-builder-api-prod --create-namespace \
            -f deploy/helm/shed-builder/values-prod.yaml \
            --set api.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-api \
            --set api.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --set api.jwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
            --cleanup-on-fail \
            --wait --timeout 10m
