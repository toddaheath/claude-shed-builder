name: Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: "Image tag to deploy (e.g., 1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: inputs.environment == 'staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install shed-builder deploy/helm/shed-builder \
            --namespace staging --create-namespace \
            --set api.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-api \
            --set api.image.tag=${{ inputs.version }} \
            --set ui.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-ui \
            --set ui.image.tag=${{ inputs.version }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --wait --timeout 5m

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: inputs.environment == 'production'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install shed-builder deploy/helm/shed-builder \
            --namespace production --create-namespace \
            --set api.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-api \
            --set api.image.tag=${{ inputs.version }} \
            --set ui.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/shed-builder-ui \
            --set ui.image.tag=${{ inputs.version }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --set ingress.enabled=true \
            --set ingress.host=${{ vars.PRODUCTION_HOST }} \
            --wait --timeout 5m
