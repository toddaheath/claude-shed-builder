name: Deploy to Dev

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # required for OIDC authentication with Azure

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/shed-builder-api:${{ steps.meta.outputs.tag }}

  deploy-spa:
    name: Deploy SPA to Storage
    needs: ci
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/shed-builder-ui/package-lock.json

      - name: Install dependencies
        working-directory: src/shed-builder-ui
        run: npm ci

      - name: Build SPA
        working-directory: src/shed-builder-ui
        env:
          VITE_API_BASE_URL: https://shed-builder-api.dev.heathrobotics.io/api/v1
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload SPA to storage account
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name stshedbuilderspadev \
            --query '[0].value' -o tsv)
          az storage blob upload-batch \
            --account-name stshedbuilderspadev \
            --destination '$web' \
            --source src/shed-builder-ui/dist/ \
            --overwrite \
            --account-key "$STORAGE_KEY"

  deploy:
    name: Deploy to Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Roll back stuck Helm release
        run: |
          STATUS=$(helm status shed-builder --namespace dev -o json 2>/dev/null | jq -r '.info.status' || echo "not-found")
          if [[ "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-install" || "$STATUS" == "pending-rollback" ]]; then
            echo "Release is stuck in status: $STATUS — rolling back"
            helm rollback shed-builder --namespace dev || helm uninstall shed-builder --namespace dev || true
          fi

      - name: Deploy with Helm
        run: |
          helm upgrade --install shed-builder deploy/helm/shed-builder \
            --namespace dev --create-namespace \
            -f deploy/helm/shed-builder/values-dev.yaml \
            --set api.image.repository=${{ vars.ACR_LOGIN_SERVER }}/shed-builder-api \
            --set api.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --set storage.accountName=${{ vars.STORAGE_ACCOUNT_NAME }} \
            --cleanup-on-fail \
            --wait --timeout 5m
