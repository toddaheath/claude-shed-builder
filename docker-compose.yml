version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shedbuilder
      POSTGRES_USER: shedbuilder
      POSTGRES_PASSWORD: shedbuilder_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shedbuilder;Username=shedbuilder;Password=shedbuilder_dev"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - postgres

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
